services:
  # 1. กล่อง Database (PostgreSQL)
  postgres:
    image: postgres:15-alpine
    container_name: product_store_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: product_store_db
    ports:
      - '5432:5432'
    volumes:
      - product_postgres_data:/var/lib/postgresql/data

  # 2. กล่องแอปพลิเคชัน NestJS ของเรา
  api:
    build: .
    container_name: product_store_api
    restart: always
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: 'postgresql://postgres:postgres@postgres:5432/product_store_db?schema=public'
    depends_on:
      - postgres

volumes:
  product_postgres_data:
